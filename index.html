<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Zadań - Lokalna Aplikacja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .completed { text-decoration: line-through; color: #adb5bd; }
        .priority-3 { border-left: 5px solid #dc3545; } /* Wysoki - czerwony */
        .priority-2 { border-left: 5px solid #ffc107; } /* Średni - żółty */
        .priority-1 { border-left: 5px solid #0dcaf0; } /* Niski - niebieski */
        .task-item { transition: transform 0.2s; cursor: default; }
        .task-item:hover { transform: scale(1.01); }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 800px;">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-dark">Lista Zadań</h1>
            <p class="lead text-muted">Zadanie rekrutacyjne - JavaScript & Accessibility</p>
        </div>

        <div class="card shadow border-0 mb-4">
            <div class="card-body p-4">
                <form id="todo-form" class="row g-3">
                    <div class="col-md-7">
                        <label for="task-input" class="form-label small fw-bold">Treść zadania</label>
                        <input type="text" id="task-input" class="form-control form-control-lg" placeholder="Co planujesz zrobić?" required>
                    </div>
                    <div class="col-md-3">
                        <label for="priority-input" class="form-label small fw-bold">Priorytet</label>
                        <select id="priority-input" class="form-select form-select-lg">
                            <option value="3">Wysoki</option>
                            <option value="2" selected>Średni</option>
                            <option value="1">Niski</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Dodaj</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row mb-3 g-2 align-items-center">
            <div class="col-md-6">
                <div class="btn-group w-100 shadow-sm" role="group" aria-label="Filtry">
                    <button class="btn btn-white btn-sm filter-btn active border" data-filter="all">Wszystkie</button>
                    <button class="btn btn-white btn-sm filter-btn border" data-filter="active">Aktywne</button>
                    <button class="btn btn-white btn-sm filter-btn border" data-filter="completed">Ukończone</button>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <select id="sort-select" class="form-select form-select-sm shadow-sm display-inline-block w-auto ms-auto">
                    <option value="date">Sortuj: Najnowsze</option>
                    <option value="priority">Sortuj: Priorytet</option>
                    <option value="name">Sortuj: Nazwa A-Z</option>
                </select>
            </div>
        </div>

        <ul id="todo-list" class="list-group shadow-sm border-0" aria-live="polite"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
